<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Nama</title>
</head>
<body>

  <form id="formNama">
    <input type="text" id="inputNama" placeholder="Ketik namamu...">
    <button type="submit">Kirim</button>
  </form>

  <p id="pesan"></p>

  <script>
    const form = document.getElementById('formNama');
    const input = document.getElementById('inputNama');
    const pesan = document.getElementById('pesan');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const nama = input.value.trim();

      if (nama === '') {
        pesan.textContent = 'Nama tidak boleh kosong!';
      } else {
        pesan.textContent = 'Halo, selamat datang ' + nama + '!';
      }
    });
  </script>

</body>
</html>
